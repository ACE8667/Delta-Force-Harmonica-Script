<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>八音阶钢琴块</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="window-titlebar" aria-label="窗口标题栏">
      <div class="window-titlebar-drag">
        <span>音符指引</span>
      </div>
      <div class="titlebar-actions">
        <button id="pin-toggle" class="pin-button" type="button" aria-label="置顶" aria-pressed="false" title="置顶">📌</button>
        <button id="quick-play" type="button">开始演奏</button>
        <button id="compact-toggle" type="button">精简</button>
        <nav class="window-controls" aria-label="窗口控制">
          <button id="minimize-window" type="button" aria-label="最小化" title="最小化">—</button>
          <button id="maximize-window" type="button" aria-label="最大化或还原" title="最大化或还原">□</button>
          <button id="close-window" class="close-window-button" type="button" aria-label="关闭" title="关闭">×</button>
        </nav>
      </div>
    </header>
    <main class="app-shell">
      <!-- 当前曲目及开始/暂停控制；播放状态由 app.js 更新。 -->
      <section class="dashboard" aria-label="曲目信息">
        <div class="song-card">
          <span>当前曲目</span>
          <div class="song-heading">
            <strong id="current-chart-title">送别</strong>
            <div class="song-actions">
              <button id="start-button" class="primary-button" type="button">开始演奏</button>
              <button id="replay-button" class="secondary-button" type="button" hidden>重新播放</button>
            </div>
          </div>
          <small id="song-status">准备就绪 · 选择开始</small>
        </div>
      </section>

      <!-- 本地曲库仅保存在当前浏览器或桌面程序中；导入/导出使用 TXT 曲谱文件。 -->
      <details class="chart-library" id="library-panel" data-panel>
        <summary>曲谱管理</summary>
        <div class="chart-library-content">
          <label class="chart-library-field">
            <span>曲谱名称</span>
            <input id="chart-title-input" type="text" maxlength="100" value="送别" aria-label="曲谱名称" />
          </label>
          <label class="chart-library-field">
            <span>本地曲库</span>
            <select id="chart-library-select" aria-label="选择本地曲谱"></select>
          </label>
          <div class="chart-library-actions">
            <button id="save-chart-button" class="secondary-button" type="button">保存到本地</button>
            <button id="import-chart-button" class="secondary-button" type="button">导入曲谱</button>
            <button id="export-chart-button" class="secondary-button" type="button">导出曲谱</button>
            <button id="delete-chart-button" class="secondary-button" type="button">删除所选</button>
            <input id="import-chart-input" type="file" accept=".txt,.json,text/plain,application/json" hidden />
          </div>
          <small id="chart-library-status" role="status">曲库加载中…</small>
        </div>
      </details>

      <!-- 演奏棋盘；接音框与琴键默认收起，游戏内自带按键框作为对齐目标。 -->
      <section class="game-card">
        <details class="settings-panel" id="settings-panel" data-panel open>
          <summary>播放设置</summary>
          <div class="lane-header">
            <span>音块颜色表示变调状态；把窗口底边对齐游戏按键框</span>
            <div class="playback-controls">
              <label class="tempo-control">
                <span>BPM</span>
                <input id="bpm-input" type="number" min="30" max="240" step="1" value="80" aria-label="每分钟节拍数" />
              </label>
              <label class="tempo-control">
                <span>循环</span>
                <input id="repeat-count-input" type="number" min="1" step="1" value="2" aria-label="曲谱循环次数" />
              </label>
              <label class="tempo-control">
                <span>换行</span>
                <input id="line-beats-input" type="number" min="1" max="64" step="1" value="16" aria-label="导出换行拍数" />
              </label>
            </div>
          </div>
          <label class="toggle-row">
            <input id="hit-zone-toggle" type="checkbox" />
            <span>显示接音框与琴键（默认收起，使用游戏内按键框对齐）</span>
          </label>
        </details>

        <details class="legend-panel" id="legend-panel" data-panel>
          <summary>音块图例</summary>
          <div class="legend">
            <span class="legend-item"><i class="legend-swatch legend-swatch--center"></i>中音（不变调）</span>
            <span class="legend-item"><i class="legend-swatch legend-swatch--up"></i>升调（右键 ↑）</span>
            <span class="legend-item"><i class="legend-swatch legend-swatch--down"></i>降调（左键 ↓）</span>
            <span class="legend-item"><i class="legend-swatch legend-swatch--sharp">#</i>半音（中键）</span>
          </div>
        </details>

        <div id="board" class="board board--no-hit-zone" aria-label="八音阶演奏区域"></div>
      </section>

    </main>
    <!-- 普通脚本按文档顺序执行：默认曲谱 → TXT 编解码 → 演奏逻辑。 -->
    <script src="demo.js"></script>
    <script src="chart-text.js"></script>
    <script src="app.js"></script>
  </body>
</html>
